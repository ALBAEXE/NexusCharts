<style>
/* Layout: una colonna di lettura stretta, barra lingue in alto, sezioni con titoletti; stile dell'app (nero e oro) */
:root{
  --bg:#f7f6f2; --surf:#ffffff; --fg:#141416; --muted:#6b6b70; --line:#e3e1da; --gold:#a8822f; --ongold:#ffffff;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--surf:#0f0f10;--fg:#f2f2f2;--muted:#8f8f91;--line:#1f1f22;--gold:#cfa551;--ongold:#1d1406;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surf:#0f0f10;--fg:#f2f2f2;--muted:#8f8f91;--line:#1f1f22;--gold:#cfa551;--ongold:#1d1406;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px}
.brand img{width:28px;height:28px;flex:none;background:#000}
h1{font-size:30px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.3px}
.upd{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lang{position:relative;flex:none}
#langbtn{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--fg);font:600 14px var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color 200ms}
#langbtn:active,#langbtn[aria-expanded="true"]{border-color:var(--gold)}
#langbtn:focus-visible,#langmenu button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#langbtn .chev{width:14px;height:14px;color:var(--muted);transition:transform 260ms cubic-bezier(.34,1.56,.64,1)}
#langbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
svg.flag{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line)}
#langmenu{position:absolute;right:0;top:calc(100% + 8px);min-width:200px;padding:6px;border-radius:18px;border:1px solid var(--line);background:var(--surf);box-shadow:0 18px 40px rgba(0,0,0,.35);z-index:20;display:flex;flex-direction:column;gap:2px;transform-origin:top right;animation:menuin 260ms cubic-bezier(.16,1,.3,1)}
#langmenu[hidden]{display:none}
@keyframes menuin{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
#langmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:transparent;color:var(--fg);font:500 15px var(--sans);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
#langmenu button:active{background:var(--line)}
#langmenu button[aria-selected="true"]{color:var(--gold);font-weight:650}
#langmenu .ck{margin-left:auto;width:16px;height:16px;color:var(--gold)}
@media (prefers-reduced-motion:reduce){#langmenu{animation:none}#langbtn .chev{transition:none}}
.short{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.short h2{margin-top:0}
.short ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
section{display:flex;flex-direction:column;gap:8px;min-width:0}
.wrap>*{min-width:0}
h2{font-size:19px;line-height:1.3;margin:0;text-wrap:balance}
h3{font-size:15.5px;margin:6px 0 0}
p{margin:0}
ul{margin:0;padding-left:20px}
li+li{margin-top:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px;table-layout:fixed}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.mail{font-family:var(--mono);color:var(--gold);white-space:nowrap;text-decoration:none;border-bottom:1px dashed currentColor;padding-bottom:1px}
.muted{color:var(--muted)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>

const L={
it:{name:'Italiano',title:'Informativa Privacy',upd:'Ultimo aggiornamento: 22 novembre 2026',
short:['In breve',['Niente pubblicità, niente tracciamento, nessuna vendita di dati.','Per l\'account servono solo username, email e password. La password non la vediamo mai: salviamo solo una sua impronta cifrata.','Watchlist, disegni, indicatori, script e impostazioni restano sul tuo telefono.','Puoi eliminare l\'account dall\'app in qualsiasi momento.']],
s:[
['Chi siamo','<p>NexusCharts è un\'app di grafici e analisi dei mercati. Per qualsiasi domanda sulla privacy scrivi a '+MAIL+'.</p>'],
['Quali dati trattiamo','<h3>Account</h3><ul><li>Username, email e lingua dell\'app.</li><li>Password: salviamo solo un\'impronta cifrata (PBKDF2), da cui non si può risalire alla password.</li><li>Data di creazione dell\'account e data dell\'ultimo cambio password.</li></ul><h3>Accesso e sicurezza</h3><ul><li>Codici di verifica via email: salvati solo in forma cifrata, valgono 15 minuti.</li><li>Sessione di accesso: un codice casuale salvato sul tuo telefono; sul server ne teniamo solo l\'impronta cifrata.</li><li>Indirizzo IP: lo usiamo per bloccare i tentativi ripetuti di accesso. Lo conserviamo come impronta non reversibile e lo cancelliamo entro un giorno.</li><li>Accesso con Face ID (solo se lo attivi): salviamo la chiave pubblica della passkey creata dal tuo iPhone, con la data di creazione e dell\'ultimo utilizzo. La chiave privata e i dati del tuo volto restano sul telefono e non li riceviamo mai.</li></ul><h3>Allarmi e notifiche (solo se li attivi)</h3><ul><li>Gli allarmi che imposti (strumento e prezzo) e l\'indirizzo di notifica fornito dal tuo browser, per avvisarti anche ad app chiusa.</li></ul><h3>Funzionamento dell\'app</h3><ul><li>Un identificativo casuale del dispositivo, il tipo di dispositivo, la versione dell\'app e l\'ora dell\'ultima apertura, per sapere se l\'app funziona e quali versioni sono in uso.</li><li>I prezzi e le candele arrivano dal nostro server. Registriamo quali strumenti vengono richiesti, senza collegarli a te.</li><li>Se qualcosa si rompe nell\'app, il dispositivo manda da solo un rapporto tecnico: messaggio d\'errore, schermata, versione dell\'app, tipo di dispositivo e browser. Niente nome, account o indirizzo IP; i rapporti si cancellano dopo 30 giorni.</li></ul><h3>Messaggi al supporto</h3><ul><li>Se ci scrivi dall\'app o via email: il testo, l\'indirizzo email e le eventuali immagini che alleghi.</li></ul>'],
['Cosa resta solo sul tuo telefono','<p>Watchlist, disegni, indicatori, script, layout del grafico e impostazioni sono salvati nella memoria del browser del tuo telefono e non vengono inviati a noi. Face ID è gestito da iPhone tramite il portachiavi: non riceviamo mai dati del tuo volto. L\'app non usa cookie di profilazione né strumenti di statistica di terze parti.</p>'],
['Perché li usiamo','<ul><li><b>Per fornirti il servizio</b> (account, accesso, prezzi, grafici): esecuzione del contratto.</li><li><b>Per la sicurezza</b> (limiti ai tentativi, avvisi di sicurezza via email): legittimo interesse a proteggere te e l\'app.</li><li><b>Per le notifiche degli allarmi</b>: il tuo consenso, che puoi revocare dalle impostazioni del telefono o dell\'app.</li></ul><p>Le email che ti mandiamo sono solo di servizio: codici, benvenuto, avvisi di sicurezza e conferma di eliminazione. Niente newsletter.</p>'],
['Con chi li condividiamo','<p>Non vendiamo e non cediamo i tuoi dati. Usiamo questi fornitori, solo per far funzionare l\'app:</p><ul><li><b>Cloudflare</b>: server, database e ricezione delle email al supporto.</li><li><b>Resend</b>: invio delle email (server in Irlanda, UE).</li><li><b>GitHub</b>: ospita i file dell\'app.</li><li><b>Apple, Google o Mozilla</b>: consegnano le notifiche al tuo dispositivo.</li></ul><p>Alcuni fornitori hanno sede negli Stati Uniti. In quei casi il trasferimento avviene con le garanzie previste dal GDPR, come le clausole contrattuali standard o il Data Privacy Framework UE-USA.</p>'],
['Per quanto tempo','<div class="tw"><table><thead><tr><th>Dato</th><th>Conservazione</th></tr></thead><tbody><tr><td>Account</td><td>Finché non lo elimini</td></tr><tr><td>Registrazione mai confermata</td><td>7 giorni</td></tr><tr><td>Codici di verifica</td><td>15 minuti</td></tr><tr><td>Sessione di accesso</td><td>90 giorni dall\'ultimo utilizzo</td></tr><tr><td>Passkey per Face ID</td><td>Finché non disattivi Face ID o elimini l\'account</td></tr><tr><td>Impronta dell\'indirizzo IP</td><td>Al massimo un giorno</td></tr><tr><td>Allarmi e notifiche</td><td>Finché li tieni attivi</td></tr><tr><td>Messaggi al supporto</td><td>Fino alla chiusura della richiesta</td></tr></tbody></table></div><p class="muted">Dopo l\'eliminazione, le copie di sicurezza tecniche del database possono conservare i dati per altri 30 giorni al massimo, poi vengono sovrascritte.</p>'],
['I tuoi diritti','<p>Puoi chiederci in ogni momento di vedere, correggere, esportare o cancellare i tuoi dati, oppure opporti a un trattamento. Puoi eliminare l\'account direttamente dall\'app, in Profilo, Impostazioni, Account. Per tutto il resto scrivi a '+MAIL+': rispondiamo entro 30 giorni. Hai anche il diritto di presentare un reclamo all\'autorità per la protezione dei dati del tuo Paese (in Italia il Garante per la protezione dei dati personali).</p>'],
['Età minima','<p>NexusCharts è riservata a persone maggiorenni (almeno 18 anni). Se veniamo a sapere che un account appartiene a una persona minorenne, per esempio perché ce lo segnalano, lo eliminiamo. Non chiediamo documenti: al momento della registrazione chiediamo solo di confermare di avere almeno 18 anni.</p>'],
['Modifiche','<p>Se cambiamo questa informativa aggiorniamo la data in alto. Se i cambiamenti sono importanti te lo diciamo nell\'app o via email.</p>']],
foot:'NexusCharts · nexuscharts.app'},

en:{name:'English',title:'Privacy Policy',upd:'Last updated: 22 November 2026',
short:['In short',['No ads, no tracking, no selling of data.','An account needs only a username, an email and a password. We never see your password: we store only an encrypted fingerprint of it.','Watchlists, drawings, indicators, scripts and settings stay on your phone.','You can delete your account from the app at any time.']],
s:[
['Who we are','<p>NexusCharts is a market charting and analysis app. For any privacy question, write to '+MAIL+'.</p>'],
['What data we process','<h3>Account</h3><ul><li>Username, email and app language.</li><li>Password: we store only an encrypted fingerprint (PBKDF2) that cannot be turned back into the password.</li><li>Account creation date and date of the last password change.</li></ul><h3>Sign-in and security</h3><ul><li>Email verification codes: stored only in encrypted form, valid for 15 minutes.</li><li>Sign-in session: a random code stored on your phone; on the server we keep only its encrypted fingerprint.</li><li>IP address: used to block repeated sign-in attempts. We keep it as an irreversible fingerprint and delete it within one day.</li><li>Sign in with Face ID (only if you turn it on): we store the public key of the passkey created by your iPhone, with the date it was created and last used. The private key and your face data stay on your phone and we never receive them.</li></ul><h3>Alerts and notifications (only if you turn them on)</h3><ul><li>The alerts you set (instrument and price) and the notification address provided by your browser, so we can notify you even when the app is closed.</li></ul><h3>Running the app</h3><ul><li>A random device identifier, the device type, the app version and the time it was last opened, so we know the app works and which versions are in use.</li><li>Prices and candles come from our server. We record which instruments are requested, without linking them to you.</li><li>If something breaks in the app, your device automatically sends a technical report: error message, screen, app version, device type and browser. No name, account or IP address; reports are deleted after 30 days.</li></ul><h3>Support messages</h3><ul><li>If you write to us from the app or by email: the text, your email address and any images you attach.</li></ul>'],
['What stays only on your phone','<p>Watchlists, drawings, indicators, scripts, chart layouts and settings are saved in your phone\'s browser storage and are not sent to us. Face ID is handled by your iPhone through the keychain: we never receive any data about your face. The app uses no profiling cookies and no third-party analytics.</p>'],
['Why we use it','<ul><li><b>To provide the service</b> (account, sign-in, prices, charts): performance of a contract.</li><li><b>For security</b> (attempt limits, security emails): our legitimate interest in protecting you and the app.</li><li><b>For alert notifications</b>: your consent, which you can withdraw in your phone or app settings.</li></ul><p>The emails we send are service emails only: codes, welcome, security notices and deletion confirmation. No newsletters.</p>'],
['Who we share it with','<p>We do not sell or hand over your data. We use these providers only to run the app:</p><ul><li><b>Cloudflare</b>: servers, database and receiving support emails.</li><li><b>Resend</b>: sending emails (servers in Ireland, EU).</li><li><b>GitHub</b>: hosts the app files.</li><li><b>Apple, Google or Mozilla</b>: deliver notifications to your device.</li></ul><p>Some providers are based in the United States. In those cases the transfer relies on the safeguards provided by the GDPR, such as standard contractual clauses or the EU-US Data Privacy Framework.</p>'],
['How long we keep it','<div class="tw"><table><thead><tr><th>Data</th><th>Retention</th></tr></thead><tbody><tr><td>Account</td><td>Until you delete it</td></tr><tr><td>Unconfirmed sign-up</td><td>7 days</td></tr><tr><td>Verification codes</td><td>15 minutes</td></tr><tr><td>Sign-in session</td><td>90 days after last use</td></tr><tr><td>Face ID passkey</td><td>Until you turn off Face ID or delete the account</td></tr><tr><td>IP address fingerprint</td><td>One day at most</td></tr><tr><td>Alerts and notifications</td><td>As long as you keep them on</td></tr><tr><td>Support messages</td><td>Until the request is closed</td></tr></tbody></table></div><p class="muted">After deletion, technical database backups may keep the data for up to 30 more days, then they are overwritten.</p>'],
['Your rights','<p>You can ask us at any time to see, correct, export or delete your data, or object to its processing. You can delete your account directly in the app, under Profile, Settings, Account. For anything else write to '+MAIL+': we reply within 30 days. You also have the right to lodge a complaint with the data protection authority of your country.</p>'],
['Minimum age','<p>NexusCharts is meant for adults aged 18 or over. If we learn that an account belongs to a minor, for example because someone reports it, we delete it. We don\'t ask for documents: when you sign up we only ask you to confirm you are at least 18.</p>'],
['Changes','<p>If we change this policy we update the date at the top. If the changes are significant we tell you in the app or by email.</p>']],
foot:'NexusCharts · nexuscharts.app'},

es:{name:'Español',title:'Política de Privacidad',upd:'Última actualización: 22 de noviembre de 2026',
short:['En resumen',['Sin publicidad, sin seguimiento, sin venta de datos.','Para la cuenta solo hacen falta un nombre de usuario, un correo y una contraseña. Nunca vemos tu contraseña: guardamos solo una huella cifrada.','La watchlist, los dibujos, los indicadores, los scripts y los ajustes se quedan en tu teléfono.','Puedes eliminar la cuenta desde la app en cualquier momento.']],
s:[
['Quiénes somos','<p>NexusCharts es una app de gráficos y análisis de mercados. Para cualquier pregunta sobre privacidad escribe a '+MAIL+'.</p>'],
['Qué datos tratamos','<h3>Cuenta</h3><ul><li>Nombre de usuario, correo e idioma de la app.</li><li>Contraseña: guardamos solo una huella cifrada (PBKDF2) a partir de la cual no se puede recuperar la contraseña.</li><li>Fecha de creación de la cuenta y fecha del último cambio de contraseña.</li></ul><h3>Acceso y seguridad</h3><ul><li>Códigos de verificación por correo: guardados solo cifrados, válidos 15 minutos.</li><li>Sesión de acceso: un código aleatorio guardado en tu teléfono; en el servidor guardamos solo su huella cifrada.</li><li>Dirección IP: la usamos para bloquear intentos repetidos de acceso. La guardamos como huella irreversible y la borramos en un día como máximo.</li><li>Acceso con Face ID (solo si lo activas): guardamos la clave pública de la llave de acceso creada por tu iPhone, con la fecha de creación y del último uso. La clave privada y los datos de tu cara se quedan en el teléfono y nunca los recibimos.</li></ul><h3>Alertas y notificaciones (solo si las activas)</h3><ul><li>Las alertas que configuras (instrumento y precio) y la dirección de notificación que proporciona tu navegador, para avisarte incluso con la app cerrada.</li></ul><h3>Funcionamiento de la app</h3><ul><li>Un identificador aleatorio del dispositivo, el tipo de dispositivo, la versión de la app y la hora de la última apertura, para saber si la app funciona y qué versiones se usan.</li><li>Los precios y las velas vienen de nuestro servidor. Registramos qué instrumentos se solicitan, sin vincularlos a ti.</li><li>Si algo falla en la app, el dispositivo envía automáticamente un informe técnico: mensaje de error, pantalla, versión de la app, tipo de dispositivo y navegador. Sin nombre, cuenta ni dirección IP; los informes se borran a los 30 días.</li></ul><h3>Mensajes al soporte</h3><ul><li>Si nos escribes desde la app o por correo: el texto, tu dirección de correo y las imágenes que adjuntes.</li></ul>'],
['Qué se queda solo en tu teléfono','<p>La watchlist, los dibujos, los indicadores, los scripts, la disposición del gráfico y los ajustes se guardan en la memoria del navegador de tu teléfono y no se nos envían. Face ID lo gestiona el iPhone mediante el llavero: nunca recibimos datos de tu cara. La app no usa cookies de perfilado ni herramientas de estadística de terceros.</p>'],
['Por qué los usamos','<ul><li><b>Para prestarte el servicio</b> (cuenta, acceso, precios, gráficos): ejecución del contrato.</li><li><b>Por seguridad</b> (límites de intentos, avisos de seguridad por correo): interés legítimo en protegerte a ti y a la app.</li><li><b>Para las notificaciones de alertas</b>: tu consentimiento, que puedes retirar en los ajustes del teléfono o de la app.</li></ul><p>Los correos que te enviamos son solo de servicio: códigos, bienvenida, avisos de seguridad y confirmación de eliminación. Sin boletines.</p>'],
['Con quién los compartimos','<p>No vendemos ni cedemos tus datos. Usamos estos proveedores solo para que la app funcione:</p><ul><li><b>Cloudflare</b>: servidores, base de datos y recepción de los correos al soporte.</li><li><b>Resend</b>: envío de correos (servidores en Irlanda, UE).</li><li><b>GitHub</b>: aloja los archivos de la app.</li><li><b>Apple, Google o Mozilla</b>: entregan las notificaciones a tu dispositivo.</li></ul><p>Algunos proveedores tienen sede en Estados Unidos. En esos casos la transferencia se basa en las garantías previstas por el RGPD, como las cláusulas contractuales tipo o el Marco de Privacidad de Datos UE-EE. UU.</p>'],
['Cuánto tiempo','<div class="tw"><table><thead><tr><th>Dato</th><th>Conservación</th></tr></thead><tbody><tr><td>Cuenta</td><td>Hasta que la elimines</td></tr><tr><td>Registro no confirmado</td><td>7 días</td></tr><tr><td>Códigos de verificación</td><td>15 minutos</td></tr><tr><td>Sesión de acceso</td><td>90 días desde el último uso</td></tr><tr><td>Llave de acceso de Face ID</td><td>Hasta que desactives Face ID o elimines la cuenta</td></tr><tr><td>Huella de la dirección IP</td><td>Un día como máximo</td></tr><tr><td>Alertas y notificaciones</td><td>Mientras las tengas activas</td></tr><tr><td>Mensajes al soporte</td><td>Hasta cerrar la solicitud</td></tr></tbody></table></div><p class="muted">Tras la eliminación, las copias de seguridad técnicas de la base de datos pueden conservar los datos hasta 30 días más; después se sobrescriben.</p>'],
['Tus derechos','<p>Puedes pedirnos en cualquier momento ver, corregir, exportar o borrar tus datos, u oponerte a un tratamiento. Puedes eliminar la cuenta directamente en la app, en Perfil, Ajustes, Cuenta. Para todo lo demás escribe a '+MAIL+': respondemos en 30 días. También tienes derecho a presentar una reclamación ante la autoridad de protección de datos de tu país.</p>'],
['Edad mínima','<p>NexusCharts está pensada para personas mayores de edad (18 años o más). Si sabemos que una cuenta pertenece a una persona menor de edad, por ejemplo porque nos lo comunican, la eliminamos. No pedimos documentos: al registrarte solo te pedimos que confirmes que tienes al menos 18 años.</p>'],
['Cambios','<p>Si cambiamos esta política actualizamos la fecha de arriba. Si los cambios son importantes te avisamos en la app o por correo.</p>']],
foot:'NexusCharts · nexuscharts.app'},

fr:{name:'Français',title:'Politique de Confidentialité',upd:'Dernière mise à jour : 22 novembre 2026',
short:['En bref',['Pas de publicité, pas de pistage, aucune vente de données.','Un compte demande seulement un nom d\'utilisateur, un e-mail et un mot de passe. Nous ne voyons jamais votre mot de passe : nous n\'en gardons qu\'une empreinte chiffrée.','Watchlist, dessins, indicateurs, scripts et réglages restent sur votre téléphone.','Vous pouvez supprimer votre compte depuis l\'app à tout moment.']],
s:[
['Qui sommes-nous','<p>NexusCharts est une app de graphiques et d\'analyse des marchés. Pour toute question sur la confidentialité, écrivez à '+MAIL+'.</p>'],
['Quelles données nous traitons','<h3>Compte</h3><ul><li>Nom d\'utilisateur, e-mail et langue de l\'app.</li><li>Mot de passe : nous ne gardons qu\'une empreinte chiffrée (PBKDF2) qui ne permet pas de retrouver le mot de passe.</li><li>Date de création du compte et date du dernier changement de mot de passe.</li></ul><h3>Connexion et sécurité</h3><ul><li>Codes de vérification par e-mail : conservés uniquement chiffrés, valables 15 minutes.</li><li>Session de connexion : un code aléatoire enregistré sur votre téléphone ; sur le serveur nous n\'en gardons que l\'empreinte chiffrée.</li><li>Adresse IP : utilisée pour bloquer les tentatives de connexion répétées. Nous la gardons sous forme d\'empreinte irréversible et la supprimons sous un jour.</li><li>Connexion avec Face ID (seulement si vous l\'activez) : nous gardons la clé publique de la clé d\'identification créée par votre iPhone, avec sa date de création et de dernière utilisation. La clé privée et les données de votre visage restent sur le téléphone et nous ne les recevons jamais.</li></ul><h3>Alertes et notifications (seulement si vous les activez)</h3><ul><li>Les alertes que vous créez (instrument et prix) et l\'adresse de notification fournie par votre navigateur, pour vous prévenir même quand l\'app est fermée.</li></ul><h3>Fonctionnement de l\'app</h3><ul><li>Un identifiant aléatoire de l\'appareil, le type d\'appareil, la version de l\'app et l\'heure de la dernière ouverture, pour savoir si l\'app fonctionne et quelles versions sont utilisées.</li><li>Les prix et les bougies viennent de notre serveur. Nous enregistrons quels instruments sont demandés, sans les relier à vous.</li><li>Si quelque chose ne fonctionne pas dans l\'app, l\'appareil envoie automatiquement un rapport technique : message d\'erreur, écran, version de l\'app, type d\'appareil et navigateur. Ni nom, ni compte, ni adresse IP ; les rapports sont supprimés après 30 jours.</li></ul><h3>Messages au support</h3><ul><li>Si vous nous écrivez depuis l\'app ou par e-mail : le texte, votre adresse e-mail et les images éventuellement jointes.</li></ul>'],
['Ce qui reste uniquement sur votre téléphone','<p>Watchlist, dessins, indicateurs, scripts, disposition des graphiques et réglages sont enregistrés dans le stockage du navigateur de votre téléphone et ne nous sont pas envoyés. Face ID est géré par l\'iPhone via le trousseau : nous ne recevons jamais de données sur votre visage. L\'app n\'utilise ni cookies de profilage ni outils de statistiques tiers.</p>'],
['Pourquoi nous les utilisons','<ul><li><b>Pour fournir le service</b> (compte, connexion, prix, graphiques) : exécution du contrat.</li><li><b>Pour la sécurité</b> (limites de tentatives, e-mails de sécurité) : intérêt légitime à vous protéger, vous et l\'app.</li><li><b>Pour les notifications d\'alertes</b> : votre consentement, que vous pouvez retirer dans les réglages du téléphone ou de l\'app.</li></ul><p>Les e-mails que nous envoyons sont uniquement des e-mails de service : codes, bienvenue, avis de sécurité et confirmation de suppression. Pas de newsletter.</p>'],
['Avec qui nous les partageons','<p>Nous ne vendons ni ne cédons vos données. Nous utilisons ces prestataires uniquement pour faire fonctionner l\'app :</p><ul><li><b>Cloudflare</b> : serveurs, base de données et réception des e-mails au support.</li><li><b>Resend</b> : envoi des e-mails (serveurs en Irlande, UE).</li><li><b>GitHub</b> : héberge les fichiers de l\'app.</li><li><b>Apple, Google ou Mozilla</b> : livrent les notifications à votre appareil.</li></ul><p>Certains prestataires sont établis aux États-Unis. Dans ce cas, le transfert repose sur les garanties prévues par le RGPD, comme les clauses contractuelles types ou le cadre de protection des données UE-États-Unis.</p>'],
['Combien de temps','<div class="tw"><table><thead><tr><th>Donnée</th><th>Conservation</th></tr></thead><tbody><tr><td>Compte</td><td>Jusqu\'à sa suppression</td></tr><tr><td>Inscription non confirmée</td><td>7 jours</td></tr><tr><td>Codes de vérification</td><td>15 minutes</td></tr><tr><td>Session de connexion</td><td>90 jours après la dernière utilisation</td></tr><tr><td>Clé d\'identification Face ID</td><td>Jusqu\'à ce que vous désactiviez Face ID ou supprimiez le compte</td></tr><tr><td>Empreinte de l\'adresse IP</td><td>Un jour au maximum</td></tr><tr><td>Alertes et notifications</td><td>Tant que vous les gardez actives</td></tr><tr><td>Messages au support</td><td>Jusqu\'à la clôture de la demande</td></tr></tbody></table></div><p class="muted">Après la suppression, les sauvegardes techniques de la base de données peuvent conserver les données jusqu\'à 30 jours de plus, puis elles sont écrasées.</p>'],
['Vos droits','<p>Vous pouvez nous demander à tout moment de consulter, corriger, exporter ou supprimer vos données, ou vous opposer à un traitement. Vous pouvez supprimer votre compte directement dans l\'app, dans Profil, Réglages, Compte. Pour tout le reste, écrivez à '+MAIL+' : nous répondons sous 30 jours. Vous avez aussi le droit d\'introduire une réclamation auprès de l\'autorité de protection des données de votre pays (en France, la CNIL).</p>'],
['Âge minimum','<p>NexusCharts s\'adresse aux personnes majeures (18 ans ou plus). Si nous apprenons qu\'un compte appartient à une personne mineure, par exemple parce qu\'on nous le signale, nous le supprimons. Nous ne demandons aucun document : lors de l\'inscription, nous vous demandons seulement de confirmer que vous avez au moins 18 ans.</p>'],
['Modifications','<p>Si nous modifions cette politique, nous mettons à jour la date en haut. Si les changements sont importants, nous vous prévenons dans l\'app ou par e-mail.</p>']],
foot:'NexusCharts · nexuscharts.app'},

de:{name:'Deutsch',title:'Datenschutzerklärung',upd:'Zuletzt aktualisiert: 22. November 2026',
short:['Kurz gesagt',['Keine Werbung, kein Tracking, kein Verkauf von Daten.','Für ein Konto brauchst du nur einen Benutzernamen, eine E-Mail und ein Passwort. Dein Passwort sehen wir nie: Wir speichern nur einen verschlüsselten Fingerabdruck davon.','Watchlist, Zeichnungen, Indikatoren, Skripte und Einstellungen bleiben auf deinem Telefon.','Du kannst dein Konto jederzeit in der App löschen.']],
s:[
['Wer wir sind','<p>NexusCharts ist eine App für Marktcharts und Analysen. Bei Fragen zum Datenschutz schreib an '+MAIL+'.</p>'],
['Welche Daten wir verarbeiten','<h3>Konto</h3><ul><li>Benutzername, E-Mail und App-Sprache.</li><li>Passwort: Wir speichern nur einen verschlüsselten Fingerabdruck (PBKDF2), aus dem sich das Passwort nicht zurückgewinnen lässt.</li><li>Erstellungsdatum des Kontos und Datum der letzten Passwortänderung.</li></ul><h3>Anmeldung und Sicherheit</h3><ul><li>Bestätigungscodes per E-Mail: nur verschlüsselt gespeichert, 15 Minuten gültig.</li><li>Anmeldesitzung: ein zufälliger Code auf deinem Telefon; auf dem Server speichern wir nur seinen verschlüsselten Fingerabdruck.</li><li>IP-Adresse: Wir nutzen sie, um wiederholte Anmeldeversuche zu blockieren. Wir speichern sie als nicht umkehrbaren Fingerabdruck und löschen sie innerhalb eines Tages.</li><li>Anmeldung mit Face ID (nur wenn du sie aktivierst): Wir speichern den öffentlichen Schlüssel des Passkeys, den dein iPhone erstellt, mit dem Datum der Erstellung und der letzten Nutzung. Der private Schlüssel und die Daten deines Gesichts bleiben auf dem Handy und wir erhalten sie nie.</li></ul><h3>Alarme und Benachrichtigungen (nur wenn du sie einschaltest)</h3><ul><li>Die Alarme, die du einstellst (Instrument und Preis), und die Benachrichtigungsadresse deines Browsers, damit wir dich auch bei geschlossener App benachrichtigen können.</li></ul><h3>Betrieb der App</h3><ul><li>Eine zufällige Gerätekennung, der Gerätetyp, die App-Version und der Zeitpunkt des letzten Öffnens, damit wir wissen, ob die App funktioniert und welche Versionen genutzt werden.</li><li>Preise und Kerzen kommen von unserem Server. Wir erfassen, welche Instrumente abgefragt werden, ohne sie mit dir zu verknüpfen.</li><li>Wenn in der App etwas kaputtgeht, sendet dein Gerät automatisch einen technischen Bericht: Fehlermeldung, Bildschirm, App-Version, Gerätetyp und Browser. Kein Name, kein Konto, keine IP-Adresse; die Berichte werden nach 30 Tagen gelöscht.</li></ul><h3>Nachrichten an den Support</h3><ul><li>Wenn du uns aus der App oder per E-Mail schreibst: der Text, deine E-Mail-Adresse und eventuell angehängte Bilder.</li></ul>'],
['Was nur auf deinem Telefon bleibt','<p>Watchlist, Zeichnungen, Indikatoren, Skripte, Chart-Layouts und Einstellungen werden im Browserspeicher deines Telefons gespeichert und nicht an uns gesendet. Face ID wird vom iPhone über den Schlüsselbund verwaltet: Wir erhalten nie Daten über dein Gesicht. Die App verwendet keine Profiling-Cookies und keine Statistik-Tools von Drittanbietern.</p>'],
['Warum wir sie nutzen','<ul><li><b>Um den Dienst bereitzustellen</b> (Konto, Anmeldung, Preise, Charts): Vertragserfüllung.</li><li><b>Für die Sicherheit</b> (Versuchslimits, Sicherheits-E-Mails): berechtigtes Interesse, dich und die App zu schützen.</li><li><b>Für Alarm-Benachrichtigungen</b>: deine Einwilligung, die du in den Einstellungen des Telefons oder der App widerrufen kannst.</li></ul><p>Wir senden nur Service-E-Mails: Codes, Willkommen, Sicherheitshinweise und Löschbestätigung. Keine Newsletter.</p>'],
['Mit wem wir sie teilen','<p>Wir verkaufen deine Daten nicht und geben sie nicht weiter. Wir nutzen diese Anbieter nur, damit die App funktioniert:</p><ul><li><b>Cloudflare</b>: Server, Datenbank und Empfang der Support-E-Mails.</li><li><b>Resend</b>: Versand der E-Mails (Server in Irland, EU).</li><li><b>GitHub</b>: hostet die Dateien der App.</li><li><b>Apple, Google oder Mozilla</b>: stellen Benachrichtigungen auf deinem Gerät zu.</li></ul><p>Einige Anbieter haben ihren Sitz in den USA. In diesen Fällen stützt sich die Übermittlung auf die Garantien der DSGVO, etwa Standardvertragsklauseln oder das EU-US Data Privacy Framework.</p>'],
['Wie lange','<div class="tw"><table><thead><tr><th>Daten</th><th>Speicherdauer</th></tr></thead><tbody><tr><td>Konto</td><td>Bis du es löschst</td></tr><tr><td>Nicht bestätigte Registrierung</td><td>7 Tage</td></tr><tr><td>Bestätigungscodes</td><td>15 Minuten</td></tr><tr><td>Anmeldesitzung</td><td>90 Tage nach der letzten Nutzung</td></tr><tr><td>Passkey für Face ID</td><td>Bis du Face ID deaktivierst oder das Konto löschst</td></tr><tr><td>Fingerabdruck der IP-Adresse</td><td>Höchstens ein Tag</td></tr><tr><td>Alarme und Benachrichtigungen</td><td>Solange du sie aktiv hast</td></tr><tr><td>Nachrichten an den Support</td><td>Bis die Anfrage abgeschlossen ist</td></tr></tbody></table></div><p class="muted">Nach der Löschung können technische Sicherungskopien der Datenbank die Daten noch bis zu 30 Tage enthalten, danach werden sie überschrieben.</p>'],
['Deine Rechte','<p>Du kannst uns jederzeit bitten, deine Daten einzusehen, zu berichtigen, zu exportieren oder zu löschen, oder einer Verarbeitung widersprechen. Dein Konto kannst du direkt in der App löschen, unter Profil, Einstellungen, Konto. Für alles andere schreib an '+MAIL+': Wir antworten innerhalb von 30 Tagen. Du hast außerdem das Recht, dich bei der Datenschutzbehörde deines Landes zu beschweren.</p>'],
['Mindestalter','<p>NexusCharts richtet sich an volljährige Personen ab 18 Jahren. Wenn wir erfahren, dass ein Konto einer minderjährigen Person gehört, zum Beispiel weil es uns gemeldet wird, löschen wir es. Wir verlangen keine Dokumente: Bei der Registrierung bitten wir dich nur zu bestätigen, dass du mindestens 18 Jahre alt bist.</p>'],
['Änderungen','<p>Wenn wir diese Erklärung ändern, aktualisieren wir das Datum oben. Bei wichtigen Änderungen informieren wir dich in der App oder per E-Mail.</p>']],
foot:'NexusCharts · nexuscharts.app'}

const ORDER=['it','en','es','fr','de'];
function pick(){let l='';try{l=(location.hash||'').slice(1)}catch(e){}if(L[l])return l;try{const s=localStorage.getItem('nx_privacy_lang');if(L[s])return s}catch(e){}const n=(navigator.language||'en').slice(0,2).toLowerCase();return L[n]?n:'en'}
function render(l){
  const d=L[l];document.documentElement.lang=l;document.title='NexusCharts · '+d.title;
  document.getElementById('t').textContent=d.title;document.getElementById('u').textContent=d.upd;
  document.getElementById('langflag').setAttribute('href','#flag-'+l);document.getElementById('langname').textContent=d.name;
  document.getElementById('langmenu').innerHTML=ORDER.map(k=>'<button type="button" role="option" id="lang-'+k+'" data-l="'+k+'" aria-selected="'+(k===l)+'"><svg class="flag" aria-hidden="true"><use href="#flag-'+k+'"/></svg><span>'+L[k].name+'</span>'+(k===l?'<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>':'')+'</button>').join('');
  document.getElementById('m').innerHTML='<div class="short"><h2>'+d.short[0]+'</h2><ul>'+d.short[1].map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'+d.s.map(x=>'<section><h2>'+x[0]+'</h2>'+x[1]+'</section>').join('');
  document.getElementById('f').textContent=d.foot;
  try{localStorage.setItem('nx_privacy_lang',l)}catch(e){}
}
const LB=document.getElementById('langbtn'),LM=document.getElementById('langmenu');
function menu(open){LM.hidden=!open;LB.setAttribute('aria-expanded',String(open));if(open){const s=LM.querySelector('[aria-selected="true"]');if(s)s.focus()}}
LB.addEventListener('click',e=>{e.stopPropagation();menu(LM.hidden)});
LM.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;render(b.dataset.l);try{history.replaceState(null,'','#'+b.dataset.l)}catch(_){}menu(false);LB.focus()});
document.addEventListener('click',e=>{if(!LM.hidden&&!e.target.closest('.lang'))menu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!LM.hidden){menu(false);LB.focus()}});
window.addEventListener('hashchange',()=>render(pick()));
render(pick());
</script>

</body>
</html>
